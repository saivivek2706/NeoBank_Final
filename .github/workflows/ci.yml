name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/neobank

jobs:
  # ---------------------------------------------------------------------
  # Backend: lint (checkstyle, in the validate phase), compile, unit +
  # Testcontainers integration tests and JaCoCo coverage for every Maven
  # module in the reactor together.
  # ---------------------------------------------------------------------
  backend-test:
    name: Backend lint, test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Testcontainers (account-, transaction-, compliance- and audit-service integration tests) needs a
      # Docker daemon - present on GitHub-hosted ubuntu-latest runners.
      - name: Lint, test and measure coverage across the whole reactor
        run: mvn -B -ntp verify

      - name: Coverage summary
        if: always()
        run: python3 scripts/coverage-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/jacoco/
          retention-days: 7

  # ---------------------------------------------------------------------
  # Frontend: lint, type-check and build the React app.
  # ---------------------------------------------------------------------
  frontend-build:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  # ---------------------------------------------------------------------
  # Security: filesystem scan for known-vulnerable dependencies, committed
  # secrets and misconfigured Dockerfiles / manifests. On PRs, also block
  # newly introduced vulnerable dependencies.
  # ---------------------------------------------------------------------
  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository (known-vulnerable dependencies, committed secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: frontend/node_modules

      # Dockerfile / Kubernetes misconfiguration findings are reported but don't fail the build (the demo
      # manifests intentionally omit hardening such as read-only root filesystems).
      - name: Scan Dockerfiles and manifests (report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          severity: CRITICAL,HIGH
          exit-code: "0"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------
  # Docker: build every service image, scan it with Trivy, and push to GHCR
  # only on main (PRs/forks need no registry credentials).
  # ---------------------------------------------------------------------
  docker-build:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - config-server
          - api-gateway
          - auth-service
          - account-service
          - transaction-service
          - notification-service
          - fraud-service
          - audit-service
          - compliance-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          load: true
          tags: neobank/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: neobank/${{ matrix.service }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  docker-build-frontend:
    name: Image frontend
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: neobank/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: neobank/frontend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend

  # ---------------------------------------------------------------------
  # End-to-end: Testcontainers starts the whole docker-compose stack and
  # drives the saga through the gateway. Slow (~10 min), so it runs on main,
  # on manual dispatch, and on PRs carrying the "e2e" label.
  # ---------------------------------------------------------------------
  e2e:
    name: End-to-end saga test
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    needs: [backend-test]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Generate throwaway secrets (.env)
        run: ./scripts/bootstrap-env.sh

      - name: Run the e2e suite
        run: mvn -B -ntp -Pe2e verify -pl e2e-tests

      - name: Dump container logs on failure
        if: failure()
        run: |
          mkdir -p e2e-logs
          for c in $(docker ps -aq); do docker logs "$c" > "e2e-logs/$(docker inspect -f '{{.Name}}' "$c" | tr -d /).log" 2>&1 || true; done

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 7
