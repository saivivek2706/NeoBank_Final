server:
  port: 8081

spring:
  application:
    name: account-service

  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:postgresql://localhost:5432/neobank_account
    # Credentials come from the environment (.env via docker compose, a k8s Secret in-cluster).
    # There is deliberately no default password: a missing secret fails fast at startup.
    username: ${POSTGRES_USER:neobank}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, not Hibernate auto-DDL
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        retries: 5
    consumer:
      group-id: account-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed

security:
  jwt:
    jwks-uri: ${JWT_JWKS_URI:http://auth-service:8080/.well-known/jwks.json}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  ratelimiter:
    instances:
      accountCreation:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 0s

ledger:
  reconciliation:
    # How often LedgerReconciliationService sweeps every account and compares
    # its cached balance against the sum of its ledger entries. A real
    # deployment would likely run this out-of-process (a scheduled batch job)
    # rather than in every account-service replica, and page on mismatch
    # instead of just logging.
    interval-ms: ${LEDGER_RECONCILIATION_INTERVAL_MS:300000}
  audit:
    cron: "0 5 * * * *"      # trial balance + drift + stuck-transfer check, hourly
    stuck-after: PT10M       # a transfer debited this long ago with no credit/reversal is "stuck in settlement"

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}]"
  level:
    com.neobank: INFO

springdoc:
  api-docs:
    enabled: ${SWAGGER_UI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}

# ---- ledger / money-movement settings --------------------------------------------------------------
accounts:
  # Demo only. In production an opening balance is money arriving from outside the bank, so only an operator may
  # record one and customers open accounts empty. docker-compose enables this so the demo can fund its own accounts.
  self-service-funding: ${ACCOUNT_SELF_SERVICE_FUNDING:false}

fees:
  transfer:
    # fee = flat + amount * percent / 100, clamped to [minimum, maximum]; charged to the sender on top of the amount.
    # All zero = no fees. Example: FEES_TRANSFER_FLAT=0.50 FEES_TRANSFER_PERCENT=0.10 FEES_TRANSFER_MAXIMUM=5
    flat: ${FEES_TRANSFER_FLAT:0}
    percent: ${FEES_TRANSFER_PERCENT:0}
    minimum: ${FEES_TRANSFER_MINIMUM:0}
    maximum: ${FEES_TRANSFER_MAXIMUM:0}

holds:
  default-ttl: PT168H        # a hold lapses by itself after 7 days unless a ttl is given
  max-ttl: P30D
  expiry-sweep-ms: 60000

