server:
  port: 8085

spring:
  application:
    name: audit-service

  config:
    import: "optional:configserver:http://localhost:8888"

  data:
    mongodb:
      uri: mongodb://${MONGO_USER:neobank}:${MONGO_PASSWORD}@localhost:27017/neobank_audit?authSource=admin
      # Spring Data MongoDB does NOT create @Indexed indexes by default. Audit idempotency depends on the
      # UNIQUE index on eventId (a redelivered Kafka message must be rejected by Mongo, see AuditService),
      # so index creation is switched on explicitly.
      auto-index-creation: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: audit-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed

security:
  jwt:
    jwks-uri: ${JWT_JWKS_URI:http://auth-service:8080/.well-known/jwks.json}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}]"
  level:
    com.neobank: INFO

springdoc:
  api-docs:
    enabled: ${SWAGGER_UI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}

# ---- tamper-evident audit chain ----------------------------------------------------------------------
audit:
  chain:
    max-attempts: 25                      # retries when several writers race for the next sequence number
    verify-interval-ms: 900000            # verify the recent chain every 15 minutes (metric neobank_audit_chain_valid)
    verify-window: 50000                  # how many of the newest records each scheduled verification covers
    checkpoint-cron: "0 0 * * * *"        # record a checkpoint of the chain head hourly
