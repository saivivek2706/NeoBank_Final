server:
  port: 8080

spring:
  application:
    name: auth-service

  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:postgresql://localhost:5432/neobank_auth
    # Credentials come from the environment (.env via docker compose, a k8s Secret in-cluster).
    # There is deliberately no default password: a missing secret fails fast at startup.
    username: ${POSTGRES_USER:neobank}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

security:
  jwt:
    # RS256 keypair for signing access tokens. NO defaults are baked in: generate a pair with
    # scripts/bootstrap-env.sh (local / docker compose) or load it from a secrets manager. The service
    # refuses to start without them rather than silently using a well-known key.
    private-key-b64: ${JWT_PRIVATE_KEY_B64}
    public-key-b64: ${JWT_PUBLIC_KEY_B64}
    key-id: ${JWT_KEY_ID:neobank-dev-key-1}
    access-token-ttl-seconds: 900   # 15 minutes

  bootstrap-admin:
    # First admin account, created on startup ONLY if both values are set (see AdminUserSeeder).
    # There is no built-in default credential. scripts/bootstrap-env.sh generates a random password.
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

  lockout:
    max-attempts: 5
    duration-minutes: 15

  pii:
    # HMAC key for the deterministic email blind index (see BlindIndexService). No default - generate with
    # scripts/bootstrap-env.sh. Note: PII_ENCRYPTION_KEY_B64 (the AES key for the actual column encryption)
    # is read directly from the environment by EncryptedStringConverter, not through this property path.
    blind-index-key-b64: ${PII_BLIND_INDEX_KEY_B64}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  ratelimiter:
    instances:
      authEndpoints:
        limit-for-period: 10
        limit-refresh-period: 1m
        timeout-duration: 0s

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}]"
  level:
    com.neobank: INFO

springdoc:
  api-docs:
    enabled: ${SWAGGER_UI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
