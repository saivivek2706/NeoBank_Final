server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Without this, every request arrives at the gateway looking like it came from this nginx
        # pod's own IP - which would make the gateway's per-IP login rate limiter rate-limit ALL
        # users behind this proxy collectively, instead of each real client individually.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Correlation id for this request; the gateway keeps it and every service logs it.
        proxy_set_header X-Request-Id $request_id;
    }

    location /ws/ {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
