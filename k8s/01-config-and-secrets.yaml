# Shared, non-sensitive configuration every service reads via envFrom.
apiVersion: v1
kind: ConfigMap
metadata:
  name: neobank-config
  namespace: neobank
data:
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
  JWT_JWKS_URI: "http://auth-service:8080/.well-known/jwks.json"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"  # override per environment/ingress host
  SPRING_CLOUD_CONFIG_URI: "http://config-server:8888"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
  SPRING_DATA_REDIS_HOST: "redis"
  ACCOUNT_SELF_SERVICE_FUNDING: "false"   # customers open accounts empty; only an ADMIN can record an opening deposit
  SWAGGER_UI_ENABLED: "true"          # set to "false" to hide Swagger UI / OpenAPI docs in production
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "ecs"   # one JSON log object per line

# NOTE: the neobank-secrets Secret is intentionally NOT in this repo. Create it from a freshly generated
# .env with:
#
#   ./scripts/bootstrap-env.sh && ./scripts/k8s-secrets.sh
#
# In a real cluster use External Secrets Operator / Sealed Secrets / Vault instead and delete the script path.
