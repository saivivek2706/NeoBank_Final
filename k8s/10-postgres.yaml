apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: neobank
data:
  init-databases.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE DATABASE neobank_auth;
        CREATE DATABASE neobank_account;
        CREATE DATABASE neobank_transaction;
        CREATE DATABASE neobank_notification;
        CREATE DATABASE neobank_fraud;
    EOSQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: neobank
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: neobank-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: neobank-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              value: neobank
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init-script, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "neobank"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-script
          configMap: { name: postgres-init, defaultMode: 0755 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: neobank
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
