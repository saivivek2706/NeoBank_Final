apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: neobank
spec:
  replicas: 1
  selector:
    matchLabels: { app: eureka-server }
  template:
    metadata:
      labels: { app: eureka-server }
    spec:
      containers:
        - name: eureka-server
          image: neobank/eureka-server:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8761 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: neobank
spec:
  selector: { app: eureka-server }
  ports: [{ port: 8761, targetPort: 8761 }]
