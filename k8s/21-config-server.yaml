apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: neobank
spec:
  replicas: 1
  selector:
    matchLabels: { app: config-server }
  template:
    metadata:
      labels: { app: config-server }
    spec:
      containers:
        - name: config-server
          image: neobank/config-server:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: neobank-config }
          ports: [{ containerPort: 8888 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8888 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: neobank
spec:
  selector: { app: config-server }
  ports: [{ port: 8888, targetPort: 8888 }]
