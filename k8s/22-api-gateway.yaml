apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: neobank
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: neobank/api-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: neobank-config }
            - secretRef: { name: neobank-secrets }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: neobank
spec:
  type: LoadBalancer   # the one externally-facing entry point into the cluster
  selector: { app: api-gateway }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: neobank
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
