apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: neobank
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: neobank/auth-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: neobank-config }
            - secretRef: { name: neobank-secrets }
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/neobank_auth
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: neobank
spec:
  selector: { app: auth-service }
  ports: [{ port: 8080, targetPort: 8080 }]
