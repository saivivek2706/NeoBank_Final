apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: neobank
spec:
  replicas: 2
  selector:
    matchLabels: { app: transaction-service }
  template:
    metadata:
      labels: { app: transaction-service }
    spec:
      containers:
        - name: transaction-service
          image: neobank/transaction-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: neobank-config }
            - secretRef: { name: neobank-secrets }
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/neobank_transaction
          ports: [{ containerPort: 8082 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: neobank
spec:
  selector: { app: transaction-service }
  ports: [{ port: 8082, targetPort: 8082 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transaction-service-hpa
  namespace: neobank
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transaction-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
