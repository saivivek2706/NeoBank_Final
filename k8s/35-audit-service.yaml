apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: neobank
spec:
  replicas: 2
  selector:
    matchLabels: { app: audit-service }
  template:
    metadata:
      labels: { app: audit-service }
    spec:
      containers:
        - name: audit-service
          image: neobank/audit-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: neobank-config }
            - secretRef: { name: neobank-secrets }
          env:
            - name: MONGO_USER
              valueFrom: { secretKeyRef: { name: neobank-secrets, key: MONGO_USER } }
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: neobank-secrets, key: MONGO_PASSWORD } }
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongo:27017/neobank_audit?authSource=admin
          ports: [{ containerPort: 8085 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8085 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "320Mi" }
            limits: { cpu: "500m", memory: "640Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: neobank
spec:
  selector: { app: audit-service }
  ports: [{ port: 8085, targetPort: 8085 }]
