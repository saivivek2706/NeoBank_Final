global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "auth-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8080"]

  - job_name: "account-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["account-service:8081"]

  - job_name: "transaction-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transaction-service:8082"]

  - job_name: "notification-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8083"]

  - job_name: "fraud-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["fraud-service:8084"]

  - job_name: "audit-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["audit-service:8085"]

  - job_name: "compliance-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["compliance-service:8086"]

  - job_name: "eureka-server"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-server:8761"]

  - job_name: "config-server"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-server:8888"]
